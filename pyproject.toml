[project]
name = "rag-project"
version = "0.1.0"
description = "Production-style hybrid-search RAG system with streaming, caching and evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "opensearch-py>=2.7",
    "redis>=5.0",
    "google-genai>=1.0",
    "arxiv>=2.1",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "gradio>=5.0",
    "openai>=3.3.1",
    "langgraph>=1.2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
local = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["BLE001"]
"evals/*" = ["BLE001"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
